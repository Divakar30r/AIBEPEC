[project]
name = "ai-agent"
version = "0.1.0"
description = "LangGraph agent that generates (and executes) PostgreSQL DDL scripts from chat"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlparse>=0.5",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
