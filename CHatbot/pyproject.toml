[project]
name = "chatbot"
version = "0.1.0"
description = "Compare ChatPromptTemplate.from_messages() vs from_template()"
readme = "README.md"
authors = [
    { name = "divakar30r", email = "divakar30r@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.27,<0.4",
    "langchain-core>=0.3.72,<0.4",
    "langchain-huggingface>=0.3.1",
    "huggingface_hub>=0.34.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
