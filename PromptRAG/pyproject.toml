[project]
name = "promptrag"
version = "0.1.0"
description = "Prompt engineering RAG: ingest a public GitHub repo and PDFs into pgvector, then semantic search"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "langchain-text-splitters>=1.1.3",
    "openai>=1.50",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
